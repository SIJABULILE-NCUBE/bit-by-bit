# Render "Blueprint" for my Express API (see DEPLOY.md)
# Render reads this file and sets the service up for me.
services:
  - type: web
    name: bit-by-bit-api
    runtime: node
    plan: free
    # Frankfurt is the closest Render region to South Africa
    region: frankfurt
    # my API lives in the server/ folder of this repo
    rootDir: server
    # I need the dev packages (TypeScript) to build, so I include them
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Render pings this to check the server is alive
    healthCheckPath: /api/health
    # only redeploy when something in server/ changes
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # sync: false means "ask me for the value in the dashboard" (never put secrets in this file)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
